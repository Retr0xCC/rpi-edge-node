---
# ========================================================
# Public Infrastructure & System Configuration
# ========================================================


# System and Network Settings
system_timezone: "Europe/Moscow"

# Storage Mount Paths
smb_mount_enabled: true
smb_mount_point: "/storage/nas"
smb_mount_options:
  - "noauto"
  - "x-systemd.automount"
  - "x-systemd.idle-timeout=60"
  - "x-systemd.device-timeout=5s"
  - "_netdev"
  - "credentials=/etc/smbcredentials"
  - "iocharset=utf8"
  - "vers=3.1.1"
  - "uid=1000"
  - "gid=1000"
  - "file_mode=0664"
  - "dir_mode=0775"
  - "noperm"

# SSH Daemon General Settings
ssh_port: 22
ssh_address_family: "inet"
ssh_listen_address: "0.0.0.0"
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_kbd_interactive_authentication: "no"
ssh_use_pam: "yes"
ssh_print_motd: "no"
main_pc_ssh_alias: "main-pc"

# Kernel sysctl Parameters for Edge Gateway
gateway_sysctl_settings:
  net.ipv4.ip_forward: 1
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.eth0.send_redirects: 0
  net.ipv4.conf.all.rp_filter: 2
  net.ipv4.conf.default.rp_filter: 2
  net.ipv4.conf.eth0.rp_filter: 2
  net.ipv6.conf.all.forwarding: 1
  net.ipv6.conf.default.forwarding: 1
  net.ipv6.conf.eth0.forwarding: 1
  net.core.default_qdisc: "fq"
  net.ipv4.tcp_congestion_control: "bbr"
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
  net.ipv4.tcp_rmem: "4096 87380 16777216"
  net.ipv4.tcp_wmem: "4096 65536 16777216"

# Base System Packages
base_packages:
  - curl
  - wget
  - htop
  - git
  - vim
  - neovim
  - source-highlight
  - tar
  - dkms
  - nftables
  - ca-certificates
  - systemd-timesyncd
  - python3-apt
  - bash-completion
  - dbus

# Firewall (UFW) General Rules
ufw_enabled: true
ufw_default_incoming_policy: "deny"
ufw_default_outgoing_policy: "allow"
ufw_default_forward_policy: "accept"

ufw_allowed_rules:
  - port: "{{ ssh_port }}"
    proto: "tcp"
    comment: "OpenSSH remote access"
  - port: "{{ awg_listen_port }}"
    proto: "udp"
    comment: "AmneziaWG incoming VPN tunnel"
  - port: "25565"
    proto: "tcp"
    comment: "Minecraft Java Edition server"
  - port: "19132"
    proto: "udp"
    comment: "Minecraft Bedrock Edition / GeyserMC"
  - port: "24454"
    proto: "udp"
    comment: "Minecraft Simple Voice Chat"
  - port: "8080"
    proto: "tcp"
    comment: "Web services (Nginx)"
  - port: "53"
    proto: "udp"
    comment: "DNS server (LAN & AWG)"
  - port: "53"
    proto: "tcp"
    comment: "DNS server (LAN & AWG)"

# Minecraft General Variables
mc_service_dir: "/opt/minecraft"
mc_data_dir: "/opt/minecraft/minecraft-data"
mc_backup_destination: "/storage/nas/backups/mc"
iztg_mc_version: "latest"
iztg_mc_backup_version: "latest"
mc_puid: 1000
mc_pgid: 1000
mc_rcon_port: 25575

# AmneziaWG Interface Defaults
awg_interface_name: "awg0"
awg_listen_port: 19302
awg_subnet_cidr: "10.9.9.1/24"
awg_ipv6_subnet_cidr: "fd00:9:9::1/64"
awg_mtu: 1280

# sing-box Public Resolvers
singbox_dns_remote: "9.9.9.9"
