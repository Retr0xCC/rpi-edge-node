---
# --------------------------------------------------------------------
# 1. Directories & Installation Tools
# --------------------------------------------------------------------
- name: Ensure sing-box configuration and state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/sing-box
    - /var/lib/sing-box

- name: Deploy sing-box-lx updater script
  ansible.builtin.template:
    src: update-sing-box-lx.sh.j2
    dest: /usr/local/bin/update-sing-box-lx
    owner: root
    group: root
    mode: '0755'

- name: Configure APT hook to trigger sing-box-lx updater during apt upgrade
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-sing-box-upgrade
    content: |
      // Automatically check and update sing-box-lx on package upgrades
      DPkg::Post-Invoke { "[ -x /usr/local/bin/update-sing-box-lx ] && /usr/local/bin/update-sing-box-lx || true"; };
    owner: root
    group: root
    mode: '0644'

# --------------------------------------------------------------------
# 2. Binary Deployment (Idempotent via 'creates')
# --------------------------------------------------------------------
- name: Install initial sing-box-lx binary if not present
  ansible.builtin.command: /usr/local/bin/update-sing-box-lx
  args:
    creates: /usr/bin/sing-box

# --------------------------------------------------------------------
# 3. Proton Pre-processor & Variable Loading
# --------------------------------------------------------------------
- name: Check for raw Proton configs directory
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../tools/proton-parser/configs"
  register: singbox_proton_raw_dir
  delegate_to: localhost
  run_once: true
  become: false

- name: Find raw Proton .conf files
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../tools/proton-parser/configs"
    recurse: true
    patterns: "*.conf"
  register: singbox_proton_conf_files
  when: singbox_proton_raw_dir.stat.exists
  delegate_to: localhost
  run_once: true
  become: false

- name: Parse Proton configs into vault_proton.yml via Go tool
  ansible.builtin.command:
    cmd: >
      go run main.go
      -i ./configs
      -o {{ role_path }}/vars/vault_proton.yml
      --encrypt
    chdir: "{{ playbook_dir }}/../tools/proton-parser"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: true
  when:
    - singbox_proton_conf_files.matched is defined
    - singbox_proton_conf_files.matched > 0

- name: Check if vault_proton.yml exists
  ansible.builtin.stat:
    path: "{{ role_path }}/vars/vault_proton.yml"
  register: singbox_vault_proton_file
  delegate_to: localhost
  run_once: true
  become: false

- name: Include Proton vault variables if file exists
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/vault_proton.yml"
  when: singbox_vault_proton_file.stat.exists

- name: Fallback empty proton_accounts fact if missing
  ansible.builtin.set_fact:
    singbox_proton_accounts: "{{ proton_accounts | default([]) }}"
  when: singbox_proton_accounts is not defined

# --------------------------------------------------------------------
# 4. Configuration & Systemd Service
# --------------------------------------------------------------------
- name: Deploy sing-box config.json with syntax validation
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/sing-box/config.json
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/bin/sing-box check -c %s' # Validates JSON rules before applying!
  diff: false # Strictly hide decrypted proxy passwords from logs
  notify: Restart sing-box service

- name: Deploy sing-box systemd service unit
  ansible.builtin.template:
    src: sing-box.service.j2
    dest: /etc/systemd/system/sing-box.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart sing-box service

- name: Ensure sing-box service is enabled and started
  ansible.builtin.systemd:
    name: sing-box
    state: started
    enabled: true
    daemon_reload: true
