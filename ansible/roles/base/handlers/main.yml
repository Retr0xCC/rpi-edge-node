---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted

- name: Restart ssh daemon
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Reload ufw
  community.general.ufw:
    state: reloaded
