[defaults]
# Default inventory path
inventory = inventory.ini

# Path to roles directory
roles_path = roles

# Disable host key checking for local homelab machines
host_key_checking = False

# Enable human-readable stdout logging
stdout_callback = default

# Number of parallel tasks
forks = 5

# Path to vault password file
vault_password_file = .vault_pass

[privilege_escalation]
# Automatically elevate privileges using sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[callback_default]
# Modern human-readable YAML output format
result_format = yaml
